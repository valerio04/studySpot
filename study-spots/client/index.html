<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpot</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

    <header class="header-principale">
        <a href="/" class="logo">
            <img src="assets/img/logo.png" alt="Logo StudySpot" class="img-logo">
            <span class="nome-logo">StudySpot</span>
        </a>
        
        <nav>
            <ul>
                <li><a href="/">Map</a></li>
                <li><a href="/ranking">Ranking</a></li>
                <li><a href="/list">List</a></li>
            </ul>
        </nav>
       <div class="user-actions-container">
            <a id="btn-login" href="/login" class="btn btn-dark-blue fw-bold">Accedi</a>
            <a id="btn-signup" href="/register" class="btn btn-outline-dark-blue fw-bold" style="display:none;">Registrati</a>
            <span id="user-info" style="display:none;">
                Benvenuto, <span id="username" class="fw-bold"></span>!
            </span>
            <a id="btn-profile" href="/profile" class="logo" style ="display:none;">
                <img src="assets/img/profile.png" alt="Logo Profile" class="img-logo">
            </a>
            <button id="btn-logout" class="btn-sm btn-outline-danger" style="display:none;">Logout</button>
        </div>
    </header>

    <main>
        <section class="principale">
            <h1> Where do you want to study?</h1>

            <form class="search-container">
                <input type="text" id="search-input" placeholder="Cerca un luogo..." />
                <button class="bottone1" type="button" id="search-button">Search</button> 
                <button class="bottone1" type="button" id="near-me-button">Near me</button> 
            </form>

            <script src="js/search.js"></script>
            <table class="results-table">
                <tbody id="results-body">
                    <!-- I risultati verranno aggiunti qui -->
                </tbody>
            </table>
        
            <div class="map-tool-container">
                
                <!-- altri oggetti -->
                <div class="tool">
                    <h4>Filter: </h4>
                    <label class="tool-item">
                        <div class="src-span">
                            <img src="assets/img/cafe-icon.png" alt="Cafe Icon" class="tool-icon">
                            <span>Cafe</span>
                        </div>
                        <input type="checkbox" class="tool-checkbox" checked>
                    </label>
                    <label class="tool-item">
                        <div class="src-span">
                            <img src="assets/img/biblioteca-icon.png" alt="Library Icon" class="tool-icon">
                            <span>Library</span>
                        </div>
                        <input type="checkbox" class="tool-checkbox" checked>
                    </label>
                    <label class="tool-item">
                        <div class="src-span">
                            <img src="assets/img/cafe-icon.png" alt="Library Icon" class="tool-icon">
                            <span>Library</span>
                        </div>
                        <input type="checkbox" class="tool-checkbox" checked>
                    </label>
                     <label class="tool-item">
                        <div class="src-span">
                            <img src="assets/img/cafe-icon.png" alt="Library Icon" class="tool-icon">
                            <span>Library</span>
                        </div>
                        <input type="checkbox" class="tool-checkbox" checked>
                    </label>
                    <label class="tool-item">
                        <div class="src-span">
                            <img src="assets/img/cafe-icon.png" alt="Library Icon" class="tool-icon">
                            <span>Library</span>
                        </div>
                        <input type="checkbox" class="tool-checkbox" checked>
                    </label>
                     
                </div>
                
                <div id="map-button-container">
                    <div class="map-button">    
                        <a href="/add-spot">
                            <img id="map-button-id" src="assets/img/button-icon.png" alt="Add Spot" />
                        </a>
                    </div>
                    <div id="map"></div>
                </div>
                <script src="js/map.js"></script>
                
                
            </div>
            


            
            
        </section>
    </main>
    <script>
        async function checkAuth() {
            const btnLogin = document.getElementById('btn-login');
            const btnSignup = document.getElementById('btn-signup');
            const btnLogout = document.getElementById('btn-logout');
            const userInfo = document.getElementById('user-info');
            const usernameSpan = document.getElementById('username');
            const profile = document.getElementById('btn-profile');
            try {
                // Chiamiamo l'endpoint che abbiamo creato prima
                const response = await fetch('/api/me',
                    { credentials: 'include' }
                );

                if (response.ok) {
                    // L'utente è loggato (Stato 200)
                    const user = await response.json();
                    console.log("Utente autenticato:", user);
                    usernameSpan.textContent = user.profile.name; // o user.email
                    
                    userInfo.style.display = 'inline';
                    profile.style.display = 'inline';
                    btnLogout.style.display = 'inline';
                    btnLogin.style.display = 'none';
                    btnSignup.style.display = 'none';
                } else {
                    // L'utente non è loggato (Stato 401)
                    btnLogin.style.display = 'inline';
                    btnSignup.style.display = 'inline';
                    userInfo.style.display = 'none';
                    btnLogout.style.display = 'none';
                    btnLogout.style.display = 'none';
                }
            } catch (error) {
                console.error("Errore durante il controllo autenticazione", error);
            }
        }

        checkAuth();

        const btnLogout = document.getElementById('btn-logout');

        btnLogout.addEventListener('click', async () => {
            const response = await fetch('/api/logout', { method: 'POST' });
            if (response.ok) {
                window.location.href = '/'; // Ricarica la pagina o vai in home
            }
        });
    </script>
    
</body>
</html>
