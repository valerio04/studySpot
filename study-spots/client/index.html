<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpot</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="assets/img/logo.png" alt="Logo" height="45">
                <span class="nome-logo h3 mb-0">StudySpot</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-4">
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/">Mappa</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/ranking">Classifica</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/list">Spot</a></li>
                </ul>
                
                <div class="user-actions-container d-flex align-items-center gap-2">
                    <a id="btn-login" href="/login" class="btn btn-primary-custom fw-bold" style="display:none;">Accedi</a>
                    <a id="btn-signup" href="/register" class="btn btn-outline-primary-custom fw-bold" style="display:none;">Registrati</a>
                    <span id="user-info" class="me-2" style="display:none;">Benvenuto, <span id="username" class="fw-bold"></span>!</span>
                    <a id="btn-profile" href="/profile" class="text-dark-blue fs-4" style="display:none;">
                        <i class="fa-solid fa-circle-user"></i>
                    </a>
                    <button id="btn-logout" class="btn btn-sm btn-outline-danger" style="display:none;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-5">
        <section class="text-center mb-5">
            <h1 class="display-4 fw-bold text-dark-blue mb-4">Dove vuoi studiare?</h1>
            
            <div class="row justify-content-center px-3">
                <div class="col-md-10 col-lg-8">
                    <form class="d-flex flex-wrap justify-content-center gap-3 mb-3">
                        <div class="input-group" style="max-width: 500px; flex-grow: 1;">
                            <input type="text" id="search-input" class="form-control rounded-start-pill border-dark-blue px-4" placeholder="Cerca un luogo...">
                            <button class="btn btn-primary-custom px-4 rounded-end-pill" type="button" id="search-button">Cerca</button>
                        </div>

                        <button class="btn btn-secondary-custom rounded-pill px-4 shadow-sm" type="button" id="near-me-button">
                            <i class="bi bi-geo-alt"></i> Vicino a me
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    <div class="table-responsive">
                        <table class="table table-hover mt-3 custom-table">
                            <tbody id="results-body">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <div class="row g-4 px-lg-5">
            <div class="col-lg-2">
                <div class="filter-card p-4 rounded-4 shadow-sm bg-light">
                    <h4 class="fw-bold mb-4">Filtri:</h4>
                    <div class="d-flex flex-column gap-3">
                        <label class="filter-item">
                            <div class="d-flex align-items-center gap-2">
                                <img src="assets/img/cafe-icon.png" width="30" alt="Bar">
                                <span class="small fw-bold">Bar</span>
                            </div>
                            <input type="checkbox" class="form-check-input" checked>
                        </label>
                        <label class="filter-item">
                            <div class="d-flex align-items-center gap-2">
                                <img src="assets/img/coworking-icon.png" width="30" alt="Library">
                                <span class="small fw-bold">Coworking</span>
                            </div>
                            <input type="checkbox" class="form-check-input" checked>
                        </label>
                        <label class="filter-item">
                            <div class="d-flex align-items-center gap-2">
                                <img src="assets/img/biblioteca-icon.png" width="30" alt="Library">
                                <span class="small fw-bold">Biblioteca</span>
                            </div>
                            <input type="checkbox" class="form-check-input" checked>
                        </label>
                        <label class="filter-item">
                            <div class="d-flex align-items-center gap-2">
                                <img src="assets/img/aula_studio-icon.png" width="30" alt="Library">
                                <span class="small fw-bold">Aula Studio</span>
                            </div>
                            <input type="checkbox" class="form-check-input" checked>
                        </label>
                    </div>

                    <div class="advanced-filters mt-4">
                        <button class="btn btn-outline-dark-blue w-100 d-flex justify-content-between align-items-center fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#advanced-filters-panel" aria-expanded="false" aria-controls="advanced-filters-panel">
                            Filtri avanzati
                            <span class="badge bg-light text-dark">Tag</span>
                        </button>

                        <div class="collapse mt-3" id="advanced-filters-panel">
                            <div class="mb-3">
                                <p class="text-uppercase small fw-bold text-secondary mb-2">Prezzo</p>
                                <div class="d-flex flex-wrap gap-2">
                                    <input type="checkbox" class="btn-check" id="tag-price-1">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-price-1">€</label>

                                    <input type="checkbox" class="btn-check" id="tag-price-2">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-price-2">€€</label>

                                    <input type="checkbox" class="btn-check" id="tag-price-3">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-price-3">€€€</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <p class="text-uppercase small fw-bold text-secondary mb-2">Ambiente</p>
                                <div class="d-flex flex-wrap gap-2">
                                    <input type="checkbox" class="btn-check" id="tag-outdoor">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-outdoor">All'aperto</label>

                                    <input type="checkbox" class="btn-check" id="tag-indoor">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-indoor">Al chiuso</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <p class="text-uppercase small fw-bold text-secondary mb-2">Servizi</p>
                                <div class="d-flex flex-wrap gap-2">
                                    <input type="checkbox" class="btn-check" id="tag-outlets">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-outlets">Prese elettriche</label>

                                    <input type="checkbox" class="btn-check" id="tag-quiet">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-quiet">Silenzioso</label>
                                </div>
                            </div>

                            <div>
                                <p class="text-uppercase small fw-bold text-secondary mb-2">Affollamento</p>
                                <div class="d-flex flex-wrap gap-2">
                                    <input type="checkbox" class="btn-check" id="tag-crowd-low">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-crowd-low">Poco affollato</label>

                                    <input type="checkbox" class="btn-check" id="tag-crowd-mid">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-crowd-mid">Medio</label>

                                    <input type="checkbox" class="btn-check" id="tag-crowd-high">
                                    <label class="btn btn-outline-secondary btn-sm" for="tag-crowd-high">Molto affollato</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-10 position-relative">
                <div id="map-container" class="rounded-4 overflow-hidden shadow-sm border">
                    <button id="search-here-button" class="search-here-btn" type="button" style="display: none;">
                        Cerca qui
                    </button>
                    <a href="/add-spot" class="add-spot-btn shadow">
                        <img src="assets/img/button-icon.png" alt="Add Spot" width="60">
                    </a>
                    <div id="map" style="height: 600px; width: 100%;"></div>
                </div>

                <div class="mt-4">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <h3 class="h5 fw-bold text-dark-blue mb-0">Spot trovati</h3>
                        <span id="map-results-count" class="small text-muted"></span>
                    </div>
                    <div id="map-results-list" class="d-flex gap-3 overflow-auto pb-2"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="js/components/spot-card.js"></script>
    <script src="js/search.js"></script>
    <script src="js/map.js"></script>
    <script src="js/checkAuth.js"></script>
</body>
</html>
