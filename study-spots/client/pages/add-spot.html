<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpot - Add Spot</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="../assets/img/logo.png" alt="Logo" height="45">
                <span class="nome-logo h3 mb-0">StudySpot</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-4">
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/">Mappa</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/ranking">Classifica</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/list">Spot</a></li>
                </ul>
                
                <div class="user-actions-container d-flex align-items-center gap-2">
                    <a id="btn-login" href="/login" class="btn btn-primary-custom fw-bold" style="display:none;">Accedi</a>
                    <a id="btn-signup" href="/register" class="btn btn-outline-primary-custom fw-bold" style="display:none;">Registrati</a>
                    <span id="user-info" class="me-2" style="display:none;">Benvenuto, <span id="username" class="fw-bold"></span>!</span>
                    <a id="btn-profile" href="/profile" class="text-dark-blue fs-4" style="display:none;">
                        <i class="fa-solid fa-circle-user"></i>
                    </a>
                    <button id="btn-logout" class="btn btn-sm btn-outline-danger" style="display:none;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-5">
                        <h1 class="h3 fw-bold text-center mb-4 text-dark-blue">Insert spot's informations</h1>
                        <form id="add-spot">
                            <div class="mb-3">
                                <input type="text" id="name-place" name="name-place" class="form-control form-control-lg" placeholder="Name Spot" required>
                            </div>
                            
                            <div class="mb-3">
                                <input type="text" id="search-input" name="address" class="form-control form-control-lg" placeholder="Address" required>
                                <script src="/js/search.js"></script>
                                <div class="search-results mt-2">
                                    <table class="table table-sm">
                                        <tbody id="results-body"></tbody>
                                    </table>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="category" class="form-label fw-bold">Category</label>
                                <select id="category" name="category" class="form-select form-select-lg">
                                    <option value="bar">Bar</option>
                                    <option value="co">Coworking</option>
                                    <option value="biblio">Biblioteca</option>
                                    <option value="au">Aula Studio</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Prezzo</label>
                                <div class="btn-group d-flex w-100" role="group">
                                    <input type="radio" class="btn-check" id="price1" name="price" value="$">
                                    <label class="btn btn-outline-secondary flex-fill" for="price1">$</label>
                                    
                                    <input type="radio" class="btn-check" id="price2" name="price" value="$$">
                                    <label class="btn btn-outline-secondary flex-fill" for="price2">$$</label>
                                    
                                    <input type="radio" class="btn-check" id="price3" name="price" value="$$$">
                                    <label class="btn btn-outline-secondary flex-fill" for="price3">$$$</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Ambiente</label>
                                <div class="btn-group d-flex w-100" role="group">
                                    <input type="radio" class="btn-check" id="outdoor" name="environment" value="outdoor">
                                    <label class="btn btn-outline-secondary flex-fill" for="outdoor">🌳 All'aperto</label>
                                    
                                    <input type="radio" class="btn-check" id="indoor" name="environment" value="indoor">
                                    <label class="btn btn-outline-secondary flex-fill" for="indoor">🏠 Al chiuso</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Servizi e Atmosfera</label>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="outlets" name="outlets" value="yes">
                                    <label class="form-check-label" for="outlets">🔌 Prese di corrente</label>
                                </div>
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="quiet" name="silenzioso" value="yes">
                                    <label class="form-check-label" for="quiet">🤫 Silenzioso</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Affollamento</label>
                                <div class="btn-group d-flex w-100" role="group">
                                    <input type="radio" class="btn-check" id="crowd1" name="crowd" value="poco affollato">
                                    <label class="btn btn-outline-secondary flex-fill" for="crowd1">👤</label>
                                    
                                    <input type="radio" class="btn-check" id="crowd2" name="crowd" value="abbastanza affollato">
                                    <label class="btn btn-outline-secondary flex-fill" for="crowd2">👥</label>
                                    
                                    <input type="radio" class="btn-check" id="crowd3" name="crowd" value="molto affollato">
                                    <label class="btn btn-outline-secondary flex-fill" for="crowd3">🫂</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Orari (Facoltativo)</label>
                                <div class="schedule-container">
                                    <div class="row mb-3">
                                        <div class="col-12">
                                            <div class="d-flex align-items-center gap-2">
                                                <label for="monday-open" class="col-3 form-label mb-0">Lunedì</label>
                                                <input type="time" id="monday-open" name="monday-open" class="form-control form-control-sm" value="09:00">
                                                <span>-</span>
                                                <input type="time" id="monday-close" name="monday-close" class="form-control form-control-sm" value="20:00">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-12">
                                            <div class="d-flex align-items-center gap-2">
                                                <label for="tuesday-open" class="col-3 form-label mb-0">Martedì</label>
                                                <input type="time" id="tuesday-open" name="tuesday-open" class="form-control form-control-sm" value="08:00">
                                                <span>-</span>
                                                <input type="time" id="tuesday-close" name="tuesday-close" class="form-control form-control-sm" value="20:00">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-12">
                                            <div class="d-flex align-items-center gap-2">
                                                <label for="wednesday-open" class="col-3 form-label mb-0">Mercoledì</label>
                                                <input type="time" id="wednesday-open" name="wednesday-open" class="form-control form-control-sm" value="08:00">
                                                <span>-</span>
                                                <input type="time" id="wednesday-close" name="wednesday-close" class="form-control form-control-sm" value="20:00">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-12">
                                            <div class="d-flex align-items-center gap-2">
                                                <label for="thursday-open" class="col-3 form-label mb-0">Giovedì</label>
                                                <input type="time" id="thursday-open" name="thursday-open" class="form-control form-control-sm" value="08:00">
                                                <span>-</span>
                                                <input type="time" id="thursday-close" name="thursday-close" class="form-control form-control-sm" value="20:00">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-12">
                                            <div class="d-flex align-items-center gap-2">
                                                <label for="friday-open" class="col-3 form-label mb-0">Venerdì</label>
                                                <input type="time" id="friday-open" name="friday-open" class="form-control form-control-sm" value="08:00">
                                                <span>-</span>
                                                <input type="time" id="friday-close" name="friday-close" class="form-control form-control-sm" value="20:00">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-12">
                                            <div class="d-flex align-items-center gap-2">
                                                <label for="saturday-open" class="col-3 form-label mb-0">Sabato</label>
                                                <input type="time" id="saturday-open" name="saturday-open" class="form-control form-control-sm" value="08:00">
                                                <span>-</span>
                                                <input type="time" id="saturday-close" name="saturday-close" class="form-control form-control-sm" value="20:00">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-12">
                                            <div class="d-flex align-items-center gap-2">
                                                <label for="sunday-open" class="col-3 form-label mb-0">Domenica</label>
                                                <input type="time" id="sunday-open" name="sunday-open" class="form-control form-control-sm" value="08:00">
                                                <span>-</span>
                                                <input type="time" id="sunday-close" name="sunday-close" class="form-control form-control-sm" value="20:00">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="photos" class="form-label fw-bold">Foto dello Spot (Max 5)</label>
                                <input type="file" id="photos" name="photos" class="form-control" accept="image/*" multiple>
                                <div id="image-preview" class="d-flex flex-wrap gap-3 mt-2">
                                </div>
                                <small class="text-muted">Puoi caricare fino a 5 immagini. Saranno ottimizzate automaticamente.</small>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Valutazione</label>
                                <div class="star-rating">
                                    <input type="radio" class="btn-check" id="star5" name="rating" value="5" required>
                                    <label class="btn btn-outline-warning" for="star5" title="5 stelle">★</label>

                                    <input type="radio" class="btn-check" id="star4" name="rating" value="4" required>
                                    <label class="btn btn-outline-warning" for="star4" title="4 stelle">★</label>

                                    <input type="radio" class="btn-check" id="star3" name="rating" value="3" required>
                                    <label class="btn btn-outline-warning" for="star3" title="3 stelle">★</label>

                                    <input type="radio" class="btn-check" id="star2" name="rating" value="2" required>
                                    <label class="btn btn-outline-warning" for="star2" title="2 stelle">★</label>

                                    <input type="radio" class="btn-check" id="star1" name="rating" value="1" required>
                                    <label class="btn btn-outline-warning" for="star1" title="1 stella">★</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="comment" class="form-label fw-bold">Commento</label>
                                <textarea id="comment" name="comment" class="form-control" placeholder="Lascia un commento (facoltativo)" rows="4"></textarea>
                            </div>

                            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                                <a id="Annulla" href="/" class="btn btn-outline-secondary btn-lg">Cancel</a>
                                <button type="submit" class="btn btn-primary-custom btn-lg fw-bold">Add Spot</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>
    <script src="/js/add-spot.js"></script>
    <script src="../js/checkAuth.js"></script>
</body>
</html>
