<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpot</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style4.css">
</head>
<body>

    <header class="header-principale">
        <a href="/" class="logo">
            <img src="../assets/img/logo.png" alt="Logo StudySpot" class="img-logo">
            <span class="nome-logo">StudySpot</span>
        </a>
        
        <nav>
            <ul>
                <li><a href="/">Map</a></li>
                <li><a href="/ranking">Ranking</a></li>
                <li><a href="/list">List</a></li>
            </ul>
        </nav>
        <a href="/login" class="bottone-login">Login</a>
    </header>

    <main>
        <section class="principale">
            <h1>Insert spot's informations</h1>
            <form id="add-spot">
                <div class="dati">
                    <input type="text" id="name-place" name="name-place" placeholder="Name Spot" required>
                    <br />
                    <input type="text" id="search-input" name="address" placeholder="Address" required>
                    
                    <script src="/js/search.js"></script>
                    <div class="search-results">
                        <table>
                            <tbody id="results-body"></tbody>
                        </table>
                    </div>
                    <br />
                    
                    
                    
                    <select id="category" name="category">
                        <option value="bar">Bar</option>
                        <option value="co">Coworking</option>
                        <option value="biblio">Biblioteca</option>
                        <option value="au">Aula Studio</option>
                    </select>

                    <fieldset>
                        <legend>Prezzo</legend>
                        <input type="radio" id="price1" name="price" value="$">
                        <label for="price1">$</label>

                        <input type="radio" id="price2" name="price" value="$$">
                        <label for="price2">$$</label>

                        <input type="radio" id="price3" name="price" value="$$$">
                        <label for="price3">$$$</label>
                    </fieldset>

                    <fieldset>
                        <legend>Ambiente</legend>
                        <input type="radio" id="outdoor" name="environment" value="outdoor">
                        <label for="outdoor">🌳 All'aperto</label>

                        <input type="radio" id="indoor" name="environment" value="indoor">
                        <label for="indoor">🏠 Al chiuso</label>
                    </fieldset>

                    <fieldset>
                        <legend>Servizi e Atmosfera</legend>
                        <input type="checkbox" id="outlets" name="outlets" value="yes">
                        <label for="outlets">🔌 Prese di corrente</label>

                        <input type="checkbox" id="quiet" name="quiet" value="yes">
                        <label for="quiet">🤫 Silenzioso</label>
                    </fieldset>

                    <fieldset>
                        <legend>Affollamento</legend>
                        <input type="radio" id="crowd1" name="crowd" value="crowd1">
                        <label for="crowd1">👤</label>

                        <input type="radio" id="crowd2" name="crowd" value="crowd2">
                        <label for="crowd2">👥</label>

                        <input type="radio" id="crowd3" name="crowd" value="crowd3">
                        <label for="crowd3">🫂</label>

                        <!-- <input type="radio" id="crowd4" name="crowd" value="crowd4">
                        <label for="crowd4">🫂🫂</label> -->
                    </fieldset>

                    <fieldset>
                        <legend>Orari (Facoltativo)</legend>
                        <div class="schedule-container">
                            <div class="schedule-day">
                                <label for="monday-open">Lunedì</label>
                                <input type="time" id="monday-open" name="monday-open" value="09:00">
                                <span>-</span>
                                <input type="time" id="monday-close" name="monday-close" value="20:00">
                            </div>
                            <div class="schedule-day">
                                <label for="tuesday-open">Martedì</label>
                                <input type="time" id="tuesday-open" name="tuesday-open" value="08:00">
                                <span>-</span>
                                <input type="time" id="tuesday-close" name="tuesday-close" value="20:00">
                            </div>
                            <div class="schedule-day">
                                <label for="wednesday-open">Mercoledì</label>
                                <input type="time" id="wednesday-open" name="wednesday-open" value="08:00">
                                <span>-</span>
                                <input type="time" id="wednesday-close" name="wednesday-close" value="20:00">
                            </div>
                            <div class="schedule-day">
                                <label for="thursday-open">Giovedì</label>
                                <input type="time" id="thursday-open" name="thursday-open" value="08:00">
                                <span>-</span>
                                <input type="time" id="thursday-close" name="thursday-close" value="20:00">
                            </div>
                            <div class="schedule-day">
                                <label for="friday-open">Venerdì</label>
                                <input type="time" id="friday-open" name="friday-open" value="08:00">
                                <span>-</span>
                                <input type="time" id="friday-close" name="friday-close" value="20:00">
                            </div>
                            <div class="schedule-day">
                                <label for="saturday-open">Sabato</label>
                                <input type="time" id="saturday-open" name="saturday-open" value="08:00">
                                <span>-</span>
                                <input type="time" id="saturday-close" name="saturday-close" value="20:00">
                            </div>
                            <div class="schedule-day">
                                <label for="sunday-open">Domenica</label>
                                <input type="time" id="sunday-open" name="sunday-open" value="08:00">
                                <span>-</span>
                                <input type="time" id="sunday-close" name="sunday-close" value="20:00">
                            </div>
                        </div>
                    </fieldset>

                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5">
                        <label for="star5" title="5 stelle">★</label>

                        <input type="radio" id="star4" name="rating" value="4">
                        <label for="star4" title="4 stelle">★</label>

                        <input type="radio" id="star3" name="rating" value="3">
                        <label for="star3" title="3 stelle">★</label>

                        <input type="radio" id="star2" name="rating" value="2">
                        <label for="star2" title="2 stelle">★</label>

                        <input type="radio" id="star1" name="rating" value="1">
                        <label for="star1" title="1 stella">★</label>
                    </div>
                    <textarea id="comment" name="comment" placeholder="Lascia un commento (facoltativo)" rows="4"></textarea>
                </div>

                <div class="bottoni">
                    <a id="Annulla" href="../index.html"> Cancel</a>
                    <button type="submit">Add Spot</button>
                </div>
            </form>
        </section>
    </main>
   <script src="../js/add-spot.js"></script>
</body>
</html>
