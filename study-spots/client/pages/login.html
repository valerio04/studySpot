<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySpot - Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="../assets/img/logo.png" alt="Logo" height="45">
                <span class="nome-logo h3 mb-0">StudySpot</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-4">
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/">Map</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/ranking">Ranking</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/list">List</a></li>
                </ul>
                
                <div class="user-actions-container d-flex align-items-center gap-2">
                    <a id="btn-login" href="/login" class="btn btn-primary-custom fw-bold" style="display:none;">Accedi</a>
                    <a id="btn-signup" href="/register" class="btn btn-outline-primary-custom fw-bold" style="display:none;">Registrati</a>
                    <span id="user-info" class="me-2" style="display:none;">Benvenuto, <span id="username" class="fw-bold"></span>!</span>
                    <a id="btn-profile" href="/profile" style="display:none;">
                        <img src="../assets/img/profile.png" alt="Profile" height="40">
                    </a>
                    <button id="btn-logout" class="btn btn-sm btn-outline-danger" style="display:none;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-5">
                        <h1 class="h3 fw-bold text-center mb-4 text-dark-blue">Insert your credentials</h1>
                        <form id="login">
                            <div class="mb-3">
                                <input type="text" id="email" name="email" class="form-control form-control-lg" placeholder="Email" required>
                                <p id="emailError" class="text-danger small mt-2"></p>
                            </div>
                            <div class="mb-4">
                                <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Password" required>
                                <p id="passwordError" class="text-danger small mt-2"></p>
                            </div>
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary-custom btn-lg fw-bold">Login</button>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <a id="registrati" href="/register" class="btn btn-outline-primary-custom btn-sm">Sign up</a>
                                <a id="forgotten-password" href="/register" class="text-muted small text-decoration-none">Password forgotten?</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
