<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina non trovata - StudySpot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="../assets/img/logo.png" alt="Logo" height="45">
                <span class="nome-logo h3 mb-0">StudySpot</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            
        </div>
    </nav>

    <main class="container d-flex align-items-center justify-content-center" style="min-height: 75vh;">
        <section class="text-center">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle shadow-sm"
                     style="width: 120px; height: 120px;">
                    <i class="fa-solid fa-map-location-dot text-orange" style="font-size: 3rem;"></i>
                </div>
            </div>

            <h1 class="display-1 fw-bold text-dark-blue mb-2">404</h1>

            <h2 class="h3 fw-bold text-dark-blue mb-3">
                Pagina non trovata
            </h2>

            <p class="text-muted mb-4 mx-auto" style="max-width: 520px;">
                Qui non abbiamo trovato nessuno spot… nemmeno con il Wi-Fi acceso.
            </p>

            <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                <a href="/" class="btn btn-primary-custom rounded-pill px-4 fw-bold">
                    <i class="fa-solid fa-map me-1"></i>
                    Torna alla mappa
                </a>

                <a href="/list" class="btn btn-outline-primary-custom rounded-pill px-4 fw-bold">
                    Vedi gli spot
                </a>
            </div>
        </section>
    </main>

    <footer class="bg-white py-3 border-top">
        <div class="container text-center">
            <p class="small text-muted mb-0">
                © 2026 StudySpot. Tutti i diritti riservati.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/checkAuth.js"></script>
