<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - StudySpot</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="assets/img/logo.png" alt="Logo" height="45">
                <span class="nome-logo h3 mb-0">StudySpot</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-4">
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/">Map</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/ranking">Ranking</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/list">List</a></li>
                </ul>
                
                <div class="user-actions-container d-flex align-items-center gap-2">
                    <a id="btn-login" href="/login" class="btn btn-primary-custom fw-bold" style="display:none;">Accedi</a>
                    <a id="btn-signup" href="/register" class="btn btn-outline-primary-custom fw-bold" style="display:none;">Registrati</a>
                    <span id="user-info" class="me-2" style="display:none;">Benvenuto, <span id="username" class="fw-bold"></span>!</span>
                    <a id="btn-profile" href="/profile" style="display:none;">
                        <img src="assets/img/profile.png" alt="Profile" height="40">
                    </a>
                    <button id="btn-logout" class="btn btn-sm btn-outline-danger" style="display:none;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center mb-5">
            <div class="col-md-8">
                <div class="ranking-user bg-light border border-dark-blue rounded-4 p-4 shadow-sm">
                    <h2 class="h4 fw-bold text-dark-blue mb-3 text-center text-md-start">La tua posizione in classifica</h2>
                    <div id="ranking-user" class="text-center text-md-start fs-5">
                        <span class="text-muted small italic">Caricamento posizione...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="ranking-container">
                    <h1 class="display-6 fw-bold text-dark-blue mb-4 text-center">Classifica Utenti</h1>
                    
                    <div class="table-responsive shadow-sm rounded-4">
                        <table class="table table-hover align-middle mb-0 custom-table">
                            <thead class="bg-dark-blue text-white">
                                <tr>
                                    <th class="ps-4 py-3">Posizione</th>
                                    <th class="py-3">Utente</th>
                                    <th class="py-3 text-center">Spot Aggiunti</th>
                                    <th class="py-3 text-center">Commenti</th>
                                    <th class="pe-4 py-3 text-end">Punti</th>
                                </tr>
                            </thead>
                            <tbody id="ranking-body">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/checkAuth.js"></script>
    <script src="../js/ranking.js"></script>
</body>
</html>
