<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classifica - StudySpot</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <img src="assets/img/logo.png" alt="Logo" height="45">
                <span class="nome-logo h3 mb-0">StudySpot</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto gap-lg-4">
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/">Mappa</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/ranking">Classifica</a></li>
                    <li class="nav-item"><a class="nav-link fw-bold text-dark-blue" href="/list">Spot</a></li>
                </ul>
                
                <div class="user-actions-container d-flex align-items-center gap-2">
                    <a id="btn-login" href="/login" class="btn btn-primary-custom fw-bold" style="display:none;">Accedi</a>
                    <a id="btn-signup" href="/register" class="btn btn-outline-primary-custom fw-bold" style="display:none;">Registrati</a>
                    <span id="user-info" class="me-2" style="display:none;">Benvenuto, <span id="username" class="fw-bold"></span>!</span>
                    <a id="btn-profile" href="/profile" class="text-dark-blue fs-4" style="display:none;">
                        <i class="fa-solid fa-circle-user"></i>
                    </a>
                    <button id="btn-logout" class="btn btn-sm btn-outline-danger" style="display:none;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5 page-ranking"> 
        <div class="row justify-content-center mb-5">
            <div class="col-md-10 col-lg-8">
                <div class="ranking-card-user shadow-sm d-flex align-items-center">
                    <div class="user-rank-badge" id="user-rank-number">#--</div>
                    <div class="flex-grow-1 ms-3">
                        <h2 class="h5 fw-bold mb-0 text-white">La tua posizione</h2>
                        <div id="ranking-user" class="text-white-50 small">
                            Caricamento...
                        </div>
                    </div>
                    <div class="user-rank-points text-end">
                        <span id="user-total-points" class="h4 fw-bold mb-0">0</span>
                        <div class="small opacity-75">Punti Totali</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="ranking-wrapper shadow-lg">
                    <div class="ranking-header">
                        <h1 class="h3 fw-bold mb-0"><i class="fa-solid fa-trophy me-2 text-warning"></i>Leaderboard</h1>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 custom-ranking-table">
                            <thead>
                                <tr>
                                    <th class="text-center">Pos.</th>
                                    <th>Utente</th>
                                    <th class="text-center d-none d-md-table-cell">Spot</th>
                                    <th class="text-center d-none d-md-table-cell">Recensioni</th>
                                    <th class="text-end pe-4">Punti</th>
                                </tr>
                            </thead>
                            <tbody id="ranking-body">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/checkAuth.js"></script>
    <script src="../js/ranking.js"></script>
</body>
</html>
