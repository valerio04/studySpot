<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotStudium</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style3.css">
</head>
<body>

    <header class="header-principale">
    <a href="/" class="logo">
            <img src="../assets/img/logo.png" alt="Logo SpotStudium" class="img-logo">
            <span class="nome-logo">SpotStudium</span>
        </a>
        
        <nav>
            <ul>
                <li><a href="/">Map</a></li>
                <li><a href="/ranking">Ranking</a></li>
                <li><a href="/list">List</a></li>
            </ul>
        </nav>
        <a href="/login" class="bottone-login">Login</a>
    </header>

    <main>
        <section class="principale">
            <h1>Insert your informations</h1>
            <form id="register">
                <div class="dati">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                    <br />
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <br>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" required>
                    <br>
                    <input type ="text" id="email" name ="email" placeholder="Email" required>
                    <br>
                    <input type="text" id="name" name="name" placeholder="First Name" required>
                    <br>
                    <input type="text" id="surname" name="surname" placeholder="Surname" required>
                    <br>
                    <input type="hidden" name="points" value="0">
                    <label for="city">City</label>
                    <select id="city" name="city">
                        <option value="na">None</option>
                        <option value="rm">Rome</option>
                        <option value="mi">Milano</option>
                        <option value="na">Napoli</option>
                    </select>
                </div>

                <div class="bottoni">
                    <a id="Annulla" href="/"> Cancel</a>
                    <button type="submit">Sign up</button>
                </div>
            </form>
        </section>
    </main>
    <script src="/js/register.js"></script>
</body>
</html>
